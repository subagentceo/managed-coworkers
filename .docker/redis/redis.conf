# managed-coworkers Redis 7 config.
#
# Sourced from vendor/redis/redis.io/docs/latest/operate/.
# Posture: cache-style with durability — every-second AOF + hourly RDB.

# ── Network ──────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no
# Password set via --requirepass flag in compose (not committed here).

# ── Persistence ──────────────────────────────────────────────────────
# AOF: append every command, fsync once per second. Survives crash with
# ≤1s of data loss. Trades a bit of latency for durability.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
no-appendfsync-on-rewrite no

# RDB snapshots as belt + suspenders. AOF replays faster from a
# recent RDB base than from cold.
save 3600 1
save 300 100
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ── Memory ───────────────────────────────────────────────────────────
maxmemory 1gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ── Connection limits ────────────────────────────────────────────────
timeout 0
tcp-keepalive 300
tcp-backlog 511
databases 16

# ── Logging ──────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ── Slow log ─────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Latency monitor ──────────────────────────────────────────────────
latency-monitor-threshold 100

# ── Client output buffer limits ──────────────────────────────────────
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
