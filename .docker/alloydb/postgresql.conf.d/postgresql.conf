# managed-coworkers AlloyDB Omni tuning (laptop scale)
#
# Sourced from vendor/alloydb-omni/cloud.google.com/alloydb/omni/current/docs/
# and AlloyDB Omni reference parameters. Tuned for 16GB MacBook host.

# ── Connection ───────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 100

# ── Memory ───────────────────────────────────────────────────────────
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 2GB

# ── WAL / checkpoint ─────────────────────────────────────────────────
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# ── AlloyDB columnar engine ──────────────────────────────────────────
# Google's columnar accelerator for analytical scans. Adds vector
# query acceleration when enable_vector_support=on.
google_columnar_engine.enabled = on
google_columnar_engine.enable_vector_support = on
google_columnar_engine.memory_size_in_mb = 256

# ── Logging ──────────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_duration_statement = 250ms
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'ddl'

# ── Extensions to load at startup ────────────────────────────────────
# pg_stat_statements: query telemetry (read via google_db_advisor).
# google_columnar_engine: required for columnar engine to be active.
shared_preload_libraries = 'pg_stat_statements,google_columnar_engine,google_db_advisor,google_job_scheduler,google_storage,alloydbg'

# ── Extension settings ───────────────────────────────────────────────
pg_stat_statements.track = all
pg_stat_statements.max = 10000
