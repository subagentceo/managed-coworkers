# Rebase open `automerge` PRs that are BEHIND main, then re-dispatch
# the required OSV check so the merge gate can re-satisfy on the new
# SHA (GITHUB_TOKEN-triggered pushes don't fire downstream workflows;
# GitHub suppresses them to prevent recursion).

name: auto-rebase

on:
  workflow_run:
    workflows: [auto-merge]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write   # required for `gh workflow run`

concurrency:
  group: auto-rebase-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rebase-behind-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Rebase every open automerge PR that is BEHIND
        run: |
          set -euo pipefail
          mapfile -t PRS < <(gh pr list \
            --state open \
            --label automerge \
            --json number,isDraft,mergeStateStatus \
            -q '.[] | select(.isDraft==false) | select(.mergeStateStatus=="BEHIND") | .number')

          if [ "${#PRS[@]}" -eq 0 ]; then
            echo "No BEHIND PRs need rebasing."
            exit 0
          fi

          echo "Found ${#PRS[@]} BEHIND PR(s): ${PRS[*]}"
          for n in "${PRS[@]}"; do
            echo "::group::Rebase PR #$n"
            if gh pr update-branch "$n"; then
              branch=$(gh pr view "$n" --json headRefName -q .headRefName)
              gh workflow run osv-scanner.yml --ref "$branch" \
                || echo "::warning::osv dispatch failed for #$n on $branch"
            else
              echo "::warning::could not rebase #$n (likely conflict)"
            fi
            echo "::endgroup::"
          done
